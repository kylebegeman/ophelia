version: 1
app: dragon-writer
kind: service
image: ghcr.io/mrbagels/dragon-writer:latest

services:
  web:
    port: 3000
    host_port: 3601
    healthcheck:
      path: /health

routes:
  - domain: dragonwriter.begam.in
    service: web

addons:
  postgres: true
  redis: false

resources:
  memory: 256m

env:
  NODE_ENV: production
