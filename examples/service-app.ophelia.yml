version: 1
app: demo-service
environment: production
kind: service
image: ghcr.io/example/demo-service:latest

pack:
  portability: critical
  owner: platform
  description: Demo service app with explicit data movement contracts.
  deploy_binding_file: ophelia/deploy.json

host_requirements:
  arch: amd64
  min_memory: 1g
  min_disk_free: 20g
  requires_edge: true
  requires_docker: true

networking:
  internal: per-app

services:
  web:
    port: 3000
    host_port: 3601
    healthcheck:
      path: /health

routes:
  - domain: demo-service.example.com
    service: web

addons:
  postgres: true
  redis: false

data:
  postgres:
    mode: shared-postgres-database
    database: demo_service
    export:
      format: custom
      command: pg_dump
    import:
      command: pg_restore
    verify:
      command: ophelia/checks/data-verify.sh
  volumes:
    - name: uploads
      mount: /app/uploads
      class: critical
      export: tar-zstd
      import: tar-zstd
  backups:
    required: true
    restore_drill_required: true
    offsite_required: true
    offsite:
      provider: restic
      target: s3://ophelia-fixtures/demo-service
      retention_days: 30
      encryption_required: true
      restore_rehearsal_cadence_days: 30
      last_rehearsal_ref: restore-drills/demo-service-latest.json

hooks:
  pre_export: ophelia/hooks/pre-export.sh
  freeze: ophelia/hooks/freeze.sh
  unfreeze: ophelia/hooks/unfreeze.sh
  post_import: ophelia/hooks/post-import.sh

resources:
  memory: 256m

env:
  NODE_ENV: production

verify:
  - name: health
    url: https://demo-service.example.com/health
  - name: home
    url: https://demo-service.example.com/
