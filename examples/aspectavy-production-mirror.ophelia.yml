version: 1
app: aspectavy-production
kind: tunnel
tunnel_target: host.docker.internal:3501

routes:
  - domain: app.aspectavy.com
  - domain: api.aspectavy.com
  - domain: docs.aspectavy.com
    path: /api/openapi.json
  - domain: docs.aspectavy.com
    path: /api/admin-cli.json
  - domain: docs.aspectavy.com
    path: /api/ai/defaults.json
  - domain: docs.aspectavy.com
    path_prefix: /docs
  - domain: docs.aspectavy.com
    rewrite_prefix: /docs
  - domain: admin.aspectavy.com
    path_prefix: /admin
  - domain: admin.aspectavy.com
    rewrite_prefix: /admin
