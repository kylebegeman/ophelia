version: 1
app: demo-tunnel
kind: tunnel
tunnel_target: host.docker.internal:3401

routes:
  - domain: app.example.com
  - domain: api.example.com
  - domain: docs.example.com
    path: /api/openapi.json
  - domain: docs.example.com
    path: /api/admin-cli.json
  - domain: docs.example.com
    path_prefix: /docs
  - domain: docs.example.com
    rewrite_prefix: /docs
  - domain: admin.example.com
    path_prefix: /admin
  - domain: admin.example.com
    rewrite_prefix: /admin
