version: 1
# Local profiles are optional operator snapshots only. Core Ophelia behavior
# should be developed and tested against fixtures/app-suite first.
profiles:
  - id: local-file-baseline
    title: Local Runtime File Baseline
    summary: Read-only baseline over public demo manifests, local runtime files, host inventory, provider observations, and hardening.
    runtime_root: ~/ophelia-runtime
    manifests_dir: ../manifests
    ophelia_root: ..
    host_config: ophelia-hosts.yml
    provider_config: ophelia-integrations.yml
    plugins_dir: ../plugins
    include_hardening: true

  - id: demo-service-file-baseline
    title: Demo Service File Baseline
    summary: Focused read-only live-readiness baseline for the public demo service manifest.
    runtime_root: ~/ophelia-runtime
    manifests_dir: ../manifests
    ophelia_root: ..
    host_config: ophelia-hosts.yml
    provider_config: ophelia-integrations.yml
    app: demo-service
    environment: staging
