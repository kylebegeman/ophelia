version: 1
profiles:
  - id: local-file-baseline
    title: Local Runtime File Baseline
    summary: Read-only baseline over repo manifests, local runtime files, host inventory, provider observations, and hardening.
    runtime_root: ~/ophelia-runtime
    manifests_dir: ../manifests
    ophelia_root: ..
    host_config: ophelia-hosts.yml
    provider_config: ophelia-integrations.yml
    plugins_dir: ../plugins
    include_hardening: true

  - id: quark-ops-production-file-baseline
    title: Quark Ops Production File Baseline
    summary: Focused read-only live-readiness baseline for the production Quark Ops manifest.
    runtime_root: ~/ophelia-runtime
    manifests_dir: ../manifests
    ophelia_root: ..
    host_config: ophelia-hosts.yml
    provider_config: ophelia-integrations.yml
    app: quark-ops
    environment: production

  - id: quark-ops-staging-file-baseline
    title: Quark Ops Staging File Baseline
    summary: Focused read-only live-readiness baseline for the staging Quark Ops manifest.
    runtime_root: ~/ophelia-runtime
    manifests_dir: ../manifests
    ophelia_root: ..
    host_config: ophelia-hosts.yml
    provider_config: ophelia-integrations.yml
    app: quark-ops-staging
    environment: staging
