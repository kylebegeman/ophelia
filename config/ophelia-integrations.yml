version: 1

github:
  preferred_provider: gh
  fallback_provider: gh
  gh:
    enabled: true
  app:
    enabled: false
    app_id_env: OPHELIA_GITHUB_APP_ID
    private_key_env: OPHELIA_GITHUB_APP_PRIVATE_KEY
    webhook_secret_env: OPHELIA_GITHUB_WEBHOOK_SECRET
    permissions:
      contents: write
      metadata: read
      actions: write
      environments: write
      secrets: write
      administration: write
      pull_requests: write
      deployments: write
    repositories: []

secrets:
  providers:
    local_runtime_env:
      enabled: true
    github_environments:
      enabled: true
    sops:
      enabled: true
      search_roots:
        - secrets
