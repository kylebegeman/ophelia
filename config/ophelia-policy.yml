# Ophelia deterministic safety policy (repo default).
#
# This file is read-only configuration consumed by the policy engine
# (src/ophelia/policy.py). It declares typed, deterministic safety rules; there
# is no expression language. Each rule names a single operation, an optional
# environment, and a `require` mapping whose keys are condition names the engine
# knows how to evaluate against a plan/operation context.
#
# Resolution order when loading: an explicit --policy path, then
# <runtime_root>/policy/ophelia-policy.yml, then this repo default.
#
# Semantics:
#   - severity: blocker | warning | info
#   - Known required condition not satisfied -> finding at the rule's severity.
#   - Unknown required condition key -> FAIL CLOSED (always a blocker), because
#     the engine cannot prove the safety property the rule asserts.
#   - Unknown top-level or advisory keys -> warning only (fail open); they never
#     block, so adding new advisory metadata is forward compatible.
version: 1

defaults:
  production_requires_plan: true
  production_requires_confirmation: true
  require_json_receipts: true

rules:
  - id: production-traffic-health-check
    operation: app.traffic.apply
    environment: production
    description: >-
      Production traffic cutover must verify the target app is healthy and keep
      a rollback path before moving live traffic.
    require:
      target_health_check: true
      rollback_available: true
    severity: blocker

  - id: production-deploy-confirmation
    operation: deploy.apply
    environment: production
    description: >-
      Production deploys must be plan-then-confirm; a confirmation token is
      required before any mutation.
    require:
      confirmation_required: true
      plan_exists: true
    severity: blocker

  - id: production-deploy-image-digest-pinned
    operation: deploy.apply
    environment: production
    description: >-
      Production deploy images should be pinned by sha256 digest so the applied
      artifact is reproducible.
    require:
      image_digest_pinned: true
    severity: warning

  - id: production-export-restore-drill
    operation: app.export.create
    environment: production
    description: >-
      A production export should have a recorded restore drill so the bundle is
      known to be restorable before it is relied upon.
    require:
      restore_drill_present: true
    severity: warning

  - id: production-export-provider-config
    operation: app.export.create
    environment: production
    description: >-
      Production exports that depend on provider automation should validate the
      provider configuration before creating the bundle.
    require:
      provider_config_validated: true
    severity: info

  - id: traffic-plan-health-check
    operation: app.traffic.plan
    environment: production
    description: >-
      Production traffic plans should surface a target health check so the
      operator sees the verification gate before confirming the apply.
    require:
      target_health_check: true
    severity: warning
