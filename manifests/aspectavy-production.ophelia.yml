version: 1
app: aspectavy-production
kind: tunnel
tunnel_target: aspectavy-production-api:3001

routes:
  - domain: app.bagels.top
  - domain: api.bagels.top
  - domain: docs.bagels.top
    path: /api/openapi.json
  - domain: docs.bagels.top
    path: /api/admin-cli.json
  - domain: docs.bagels.top
    path: /api/ai/defaults.json
  - domain: docs.bagels.top
    path_prefix: /docs
  - domain: docs.bagels.top
    rewrite_prefix: /docs
  - domain: admin.bagels.top
    path_prefix: /admin
  - domain: admin.bagels.top
    rewrite_prefix: /admin
