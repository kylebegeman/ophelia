version: 1
app: demo-service
environment: staging
kind: service
image: ghcr.io/example/demo-service:latest

env_files:
  - env/demo-service.staging.env

services:
  web:
    port: 3000
    healthcheck:
      path: /health

routes:
  - domain: demo-service.example.com
    service: web

addons:
  postgres: true
  redis: false

verify:
  - name: health
    url: https://demo-service.example.com/health
  - name: home
    url: https://demo-service.example.com/
