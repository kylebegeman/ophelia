name: Deploy Platform

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ophelia-production-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Validate before production sync
        run: |
          make validate-manifests
          make render-manifests
          make test PYTHON=python
          make compile PYTHON=python
          make docs-check PYTHON=python

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          missing=0
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing required secret::${name} is empty."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Start SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_SSH_KEY}" ]]; then
            echo "::error title=Missing VPS SSH key::VPS_SSH_KEY is empty."
            exit 1
          fi

          key_file="${RUNNER_TEMP}/ophelia-vps-key"
          printf '%s\n' "${VPS_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"
          ssh-add "${key_file}" >/dev/null

      - name: Sync platform repo to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          rsync -az \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'build' \
            --exclude 'ophelia_runtime' \
            --filter 'P platform/shared/.env' \
            -e "ssh -p ${VPS_PORT} -o StrictHostKeyChecking=no" \
            ./ "${VPS_USER}@${VPS_HOST}:/home/${VPS_USER}/ophelia/"

      - name: Bootstrap remote host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "cd ~/ophelia && ./platform/scripts/bootstrap-host.sh"

      - name: Apply platform-owned manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "cd ~/ophelia && ./platform/scripts/apply-manifests.sh"
