name: Deploy Platform

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_SSH_KEY}" ]]; then
            echo "::error title=Missing VPS SSH key::VPS_SSH_KEY is empty."
            exit 1
          fi

          key_file="${RUNNER_TEMP}/ophelia-vps-key"
          printf '%s\n' "${VPS_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"
          ssh-add "${key_file}" >/dev/null

      - name: Sync platform repo to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'build' \
            --exclude 'ophelia_runtime' \
            --filter 'P platform/shared/.env' \
            -e "ssh -p ${VPS_PORT} -o StrictHostKeyChecking=no" \
            ./ "${VPS_USER}@${VPS_HOST}:/home/${VPS_USER}/ophelia/"

      - name: Bootstrap remote host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "cd ~/ophelia && ./platform/scripts/bootstrap-host.sh"

      - name: Apply platform-owned manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "cd ~/ophelia && ./platform/scripts/apply-manifests.sh"
