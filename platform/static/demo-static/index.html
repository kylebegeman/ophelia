<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Static App</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #111827;
      }

      main {
        max-width: 680px;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        color: #475569;
      }

      code {
        color: #0f766e;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo Static App</h1>
      <p>
        This fixture-style static page is safe to publish and render from
        <code>platform/static/demo-static</code>.
      </p>
    </main>
  </body>
</html>
