services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPHELIA_RUNTIME_ROOT}/caddy/sites.d:/etc/caddy/sites.d:ro
      - ${OPHELIA_RUNTIME_ROOT}:${OPHELIA_RUNTIME_ROOT}:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ophelia-edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ophelia-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - ophelia-internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  ophelia-edge:
    name: ophelia-edge
  ophelia-internal:
    name: ophelia-internal
    internal: true
