services:
  caddy:
    image: caddy:2-alpine
    profiles:
      - edge
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPHELIA_HTTP_PORT:-80}:80"
      - "${OPHELIA_HTTPS_PORT:-443}:443"
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
      - --envfile
      - /etc/caddy/env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPHELIA_RUNTIME_ROOT:-/home/kyle/ophelia-runtime}/caddy/env:/etc/caddy/env:ro
      - ${OPHELIA_RUNTIME_ROOT:-/home/kyle/ophelia-runtime}/caddy/global.d:/etc/caddy/global.d:ro
      - ${OPHELIA_RUNTIME_ROOT:-/home/kyle/ophelia-runtime}/caddy/sites.d:/etc/caddy/sites.d:ro
      - ${OPHELIA_RUNTIME_ROOT:-/home/kyle/ophelia-runtime}:${OPHELIA_RUNTIME_ROOT:-/home/kyle/ophelia-runtime}:ro
      - /home/kyle/websites:/home/kyle/websites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ophelia-edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ophelia-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ophelia-internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  ophelia-edge:
    name: ophelia-edge
    external: true
  ophelia-internal:
    name: ophelia-internal
    external: true
