version: 1
app: fixture-postgres-api
environment: staging
kind: service

services:
  api:
    image: ghcr.io/ophelia-fixtures/postgres-api@sha256:2222222222222222222222222222222222222222222222222222222222222222
    port: 8080
    host_port: 18081
    healthcheck:
      path: /health

routes:
  - domain: postgres.fixture.invalid
    service: api

env:
  API_TOKEN: fixture-required

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic service fixture with explicit Postgres data contracts.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 2gb
  min_disk_free: 10gb

data:
  postgres:
    mode: shared-postgres-database
    database: fixture_postgres_api
    export:
      command: pg_dump --format=custom --file=fixture_postgres_api.dump fixture_postgres_api
    import:
      command: pg_restore --clean --dbname=fixture_postgres_api fixture_postgres_api.dump
    verify:
      command: psql fixture_postgres_api -c "select 1"
  backups:
    required: true
    restore_drill_required: true
    offsite_required: true
    offsite:
      provider: restic
      target: s3://ophelia-fixtures/fixture-postgres-api
      retention_days: 30
      encryption_required: true
      restore_rehearsal_cadence_days: 30
      last_rehearsal_ref: restore-drills/fixture-postgres-api-latest.json
    max_age_hours: 1000000

observability:
  health:
    url: https://postgres.fixture.invalid/health
    expect_status: 200
  metrics:
    url: https://postgres.fixture.invalid/metrics
    format: prometheus
    auth: none
  logs:
    containers: true
    retain_days: 30
