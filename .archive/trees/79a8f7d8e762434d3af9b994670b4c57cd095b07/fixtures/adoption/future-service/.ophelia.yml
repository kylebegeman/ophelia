version: 1
app: future-service
environment: staging
kind: service

services:
  web:
    image: ghcr.io/ophelia-fixtures/future-service@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    port: 8080
    healthcheck:
      path: /health

routes:
  - domain: future-service.fixture.invalid
    service: web

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic future service app repo for adoption planning.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 1gb
  min_disk_free: 5gb

data:
  postgres:
    mode: shared-postgres-database
    database: future_service
    export:
      command: pg_dump --format=custom --file=future_service.dump future_service
    import:
      command: pg_restore --clean --dbname=future_service future_service.dump
    verify:
      command: psql future_service -c "select 1"
  backups:
    required: true
    restore_drill_required: true
    offsite_required: true
    offsite:
      provider: restic
      target: s3://ophelia-fixtures/future-service
      retention_days: 30
      encryption_required: true
      restore_rehearsal_cadence_days: 30
      last_rehearsal_ref: restore-drills/future-service-latest.json

observability:
  health:
    url: https://future-service.fixture.invalid/health
    expect_status: 200
  logs:
    containers: true
    retain_days: 14

verify:
  - name: ophelia-health
    service: app
    path: /ophelia/health
    method: GET
    expect_status: 200
    json_assertions:
      - $.kind == "product.runtime.health"
      - $.ok == true
  - name: ophelia-release
    service: app
    path: /ophelia/release
    method: GET
    expect_status: 200
    json_assertions:
      - $.kind == "product.runtime.release"
  - name: ophelia-data-verify
    type: command
    service: web
    command:
      - npm
      - run
      - ophelia:data:verify
