schema_version: 1
kind: ophelia.plugin_manifest
name: fixture-app-suite
version: 0.1.0
display_name: Fixture App Suite
description: Synthetic Ophelia app suite for readiness, placement, drift, backup, restore, and provider contract testing.
enabled_by_default: false

capabilities:
  - type: app_template
    id: fixture-static-site
    summary: Static app manifest and source fixture.
    manifest: fixtures/app-suite/manifests/fixture-static-site.ophelia.yml
  - type: app_template
    id: fixture-http-service
    summary: Single HTTP service manifest and runtime fixture.
    manifest: fixtures/app-suite/manifests/fixture-http-service.ophelia.yml
  - type: app_template
    id: fixture-postgres-api
    summary: Postgres-backed service with backup and restore evidence.
    manifest: fixtures/app-suite/manifests/fixture-postgres-api.ophelia.yml
  - type: app_template
    id: fixture-redis-worker
    summary: Redis-backed worker service fixture.
    manifest: fixtures/app-suite/manifests/fixture-redis-worker.ophelia.yml
  - type: app_template
    id: fixture-multi-service
    summary: Multi-service API plus web routing fixture.
    manifest: fixtures/app-suite/manifests/fixture-multi-service.ophelia.yml
  - type: app_template
    id: fixture-tunnel-app
    summary: Tunnel app fixture with inherited upstream target.
    manifest: fixtures/app-suite/manifests/fixture-tunnel-app.ophelia.yml
  - type: app_template
    id: fixture-stateful-volume
    summary: Stateful volume fixture with critical backup evidence.
    manifest: fixtures/app-suite/manifests/fixture-stateful-volume.ophelia.yml
  - type: app_template
    id: fixture-incomplete-app
    summary: Deliberately incomplete app used to keep blocked-state coverage.
    manifest: fixtures/app-suite/manifests/fixture-incomplete-app.ophelia.yml
  - type: provider_adapter
    id: fixture-github-observations
    summary: Local GitHub observation files for provider drift tests.
    observation_root: fixtures/app-suite/runtime/github/observations
  - type: secret_provider
    id: fixture-secret-observations
    summary: Local secret presence observation files with names only.
    observation_root: fixtures/app-suite/runtime/github/secret-observations
  - type: host_inventory_adapter
    id: fixture-hosts
    summary: Synthetic host inventory for placement tests.
    config: fixtures/app-suite/host-inventory.yml
  - type: lumen_surface
    id: fixture-live-readiness
    summary: Fixture-backed live-readiness report surface.
    command: ship live-readiness run --runtime-root fixtures/app-suite/runtime --manifests-dir fixtures/app-suite/manifests --host-config fixtures/app-suite/host-inventory.yml --provider-config fixtures/app-suite/integrations.yml --allow-blocked --json

commands:
  - command: ship live-readiness run
    operation: plugin.fixture-app-suite.live-readiness
    summary: Run the live-readiness lane against the committed fixture suite.
    risk: low
    mutates_state: false
    requires_confirmation: false
    json_kind: ophelia.live_readiness_report
    args_schema:
      type: object
      properties:
        runtime_root:
          type: string
        manifests_dir:
          type: string
        host_config:
          type: string
        provider_config:
          type: string
        allow_blocked:
          type: boolean
        json:
          type: boolean
      required: []
      additionalProperties: false
    examples:
      - ship live-readiness run --runtime-root fixtures/app-suite/runtime --manifests-dir fixtures/app-suite/manifests --host-config fixtures/app-suite/host-inventory.yml --provider-config fixtures/app-suite/integrations.yml --allow-blocked --json

lumen_surfaces:
  - id: fixture-live-readiness
    title: Fixture Live Readiness
    kind: report
    summary: Read-only fixture app suite readiness, placement, provider, and drift report.
    read_only: true

compatibility:
  ophelia_schema_version: 1
  plugin_contract: metadata-only

safety_notes:
  - Metadata-only plugin. Ophelia does not import or execute plugin code from this manifest.
  - Fixture values are synthetic and must never be replaced with production secrets.
  - The fixture live-readiness report is expected to be blocked because one app is deliberately incomplete.

metadata:
  fixture_root: fixtures/app-suite
  expected_app_count: 8
  expected_blocked_app: fixture-incomplete-app

