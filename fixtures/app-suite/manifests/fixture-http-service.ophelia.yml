version: 1
app: fixture-http-service
environment: staging
kind: service

services:
  web:
    image: ghcr.io/ophelia-fixtures/http-service@sha256:1111111111111111111111111111111111111111111111111111111111111111
    port: 8080
    host_port: 18080
    env:
      LOG_LEVEL: info
    healthcheck:
      path: /health

routes:
  - domain: http.fixture.invalid
    service: web

env:
  API_TOKEN: fixture-required

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic single-service HTTP fixture.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 1gb
  min_disk_free: 5gb

data:
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://http.fixture.invalid/health
    expect_status: 200
  metrics:
    url: https://http.fixture.invalid/metrics
    format: prometheus
    auth: none
  logs:
    containers: true
    retain_days: 14

