version: 1
app: fixture-stateful-volume
environment: staging
kind: service

services:
  web:
    image: ghcr.io/ophelia-fixtures/stateful-volume@sha256:6666666666666666666666666666666666666666666666666666666666666666
    port: 8080
    host_port: 18084
    mounts:
      - source: ../apps/stateful-volume/data
        target: /data
        read_only: false
        bind: true
    healthcheck:
      path: /health

routes:
  - domain: volume.fixture.invalid
    service: web

env:
  STORAGE_TOKEN: fixture-required

pack:
  portability: critical
  owner: platform-fixtures
  description: Synthetic stateful-volume fixture with backup and restore evidence.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 2gb
  min_disk_free: 20gb

data:
  volumes:
    - name: fixture-volume-data
      mount: /data
      source: ../apps/stateful-volume/data
      service: web
      class: critical
      export: tar -cf fixture-volume-data.tar /data
      import: tar -xf fixture-volume-data.tar -C /
      verify:
        command: test -d /data
  backups:
    required: true
    restore_drill_required: true
    offsite_required: true
    max_age_hours: 1000000

observability:
  health:
    url: https://volume.fixture.invalid/health
    expect_status: 200
  logs:
    containers: true
    retain_days: 30

