version: 1
app: fixture-tunnel-app
environment: staging
kind: tunnel
tunnel_target: https://upstream.fixture.invalid

routes:
  - domain: tunnel.fixture.invalid

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic tunnel fixture using an inherited upstream target.

host_requirements:
  requires_edge: true
  requires_docker: false
  min_memory: 512m
  min_disk_free: 1gb

data:
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://tunnel.fixture.invalid/health
    expect_status: 200
  logs:
    containers: false
    retain_days: 7

