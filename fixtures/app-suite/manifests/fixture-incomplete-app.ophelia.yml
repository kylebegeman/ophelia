version: 1
app: fixture-incomplete-app
environment: staging
kind: service

services:
  web:
    image: ghcr.io/ophelia-fixtures/incomplete:latest
    port: 8080
    healthcheck:
      path: /health

routes:
  - domain: incomplete.fixture.invalid
    service: web

env:
  MISSING_TOKEN: fixture-required

pack:
  portability: standard
  owner: platform-fixtures
  description: Deliberately incomplete fixture for blocked readiness coverage.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 1gb
  min_disk_free: 5gb

data:
  backups:
    required: true
    restore_drill_required: true
    offsite_required: false
    max_age_hours: 1000000

observability:
  health:
    url: https://incomplete.fixture.invalid/health
    expect_status: 200
  logs:
    containers: true
    retain_days: 14

