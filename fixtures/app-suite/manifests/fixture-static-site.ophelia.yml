version: 1
app: fixture-static-site
environment: staging
kind: static
static_root: ../apps/static-basic

routes:
  - domain: static.fixture.invalid

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic static-site fixture with no Docker requirement.

host_requirements:
  requires_edge: true
  requires_docker: false
  min_memory: 512m
  min_disk_free: 1gb

data:
  static_assets:
    - name: static-root
      source: ../apps/static-basic
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://static.fixture.invalid/health
    expect_status: 200
  logs:
    containers: false
    retain_days: 7

