version: 1
app: fixture-redis-worker
environment: staging
kind: service

services:
  worker:
    image: ghcr.io/ophelia-fixtures/redis-worker@sha256:3333333333333333333333333333333333333333333333333333333333333333
    port: 9090
    env:
      WORKER_MODE: queue
    healthcheck:
      path: /health

routes:
  - domain: redis-worker.fixture.invalid
    service: worker

env:
  WORKER_TOKEN: fixture-required

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic Redis-backed worker fixture.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 1gb
  min_disk_free: 5gb

data:
  redis:
    mode: redis-logical-db
    database: fixture-redis-worker
    durable: true
    export:
      command: redis-cli --rdb fixture-redis-worker.rdb
    import:
      command: redis-cli --pipe < fixture-redis-worker.rdb
    verify:
      command: redis-cli ping
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://redis-worker.fixture.invalid/health
    expect_status: 200
  logs:
    containers: true
    retain_days: 14

