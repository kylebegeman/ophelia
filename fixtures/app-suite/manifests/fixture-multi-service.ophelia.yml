version: 1
app: fixture-multi-service
environment: staging
kind: multi-service

services:
  api:
    image: ghcr.io/ophelia-fixtures/multi-api@sha256:4444444444444444444444444444444444444444444444444444444444444444
    port: 8080
    host_port: 18082
    healthcheck:
      path: /health
  web:
    image: ghcr.io/ophelia-fixtures/multi-web@sha256:5555555555555555555555555555555555555555555555555555555555555555
    port: 3000
    host_port: 18083
    healthcheck:
      path: /

routes:
  - domain: multi.fixture.invalid
    path_prefix: /api
    strip_prefix: /api
    service: api
  - domain: multi.fixture.invalid
    service: web

env:
  API_TOKEN: fixture-required
  PUBLIC_BASE_URL: https://multi.fixture.invalid

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic multi-service fixture with API and web routes.

host_requirements:
  requires_edge: true
  requires_docker: true
  min_memory: 2gb
  min_disk_free: 8gb

data:
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://multi.fixture.invalid/health
    expect_status: 200
  metrics:
    url: https://multi.fixture.invalid/metrics
    format: prometheus
    auth: none
  logs:
    containers: true
    retain_days: 14

