version: 1
github:
  preferred_provider: gh
  fallback_provider: gh
  gh:
    enabled: true
  app:
    enabled: false
  repositories:
    - app: fixture-static-site
      repo: ophelia-fixtures/fixture-static-site
      provider: gh
    - app: fixture-http-service
      repo: ophelia-fixtures/fixture-http-service
      provider: gh
    - app: fixture-postgres-api
      repo: ophelia-fixtures/fixture-postgres-api
      provider: gh
    - app: fixture-redis-worker
      repo: ophelia-fixtures/fixture-redis-worker
      provider: gh
    - app: fixture-multi-service
      repo: ophelia-fixtures/fixture-multi-service
      provider: gh
    - app: fixture-tunnel-app
      repo: ophelia-fixtures/fixture-tunnel-app
      provider: gh
    - app: fixture-stateful-volume
      repo: ophelia-fixtures/fixture-stateful-volume
      provider: gh
    - app: fixture-incomplete-app
      repo: ophelia-fixtures/fixture-incomplete-app
      provider: gh
secrets:
  providers:
    local_runtime_env:
      enabled: true
    github_environments:
      enabled: true
    sops:
      enabled: true
      search_roots:
        - fixtures/app-suite/runtime/secrets
metadata:
  api_token: fixture-provider-token-value

