version: 1
hosts:
  - id: fixture-edge-a
    name: Fixture Edge A
    provider: fixture
    region: local-lab
    architecture: amd64
    roles:
      - runtime
      - edge
      - data
    labels:
      - fixture
      - primary
    capabilities:
      docker: true
      docker_compose: true
      caddy: true
      edge: true
      network: true
      backups: true
      postgres: true
      redis: true
      static_assets: true
      service_runtime: true
    capacity:
      memory: 16gb
      disk_free: 250gb
    apps:
      - app: fixture-postgres-api
        environment: staging
        release_id: fixture-postgres-api-20260622T120000Z
      - app: fixture-stateful-volume
        environment: staging
        release_id: fixture-stateful-volume-20260622T120000Z

  - id: fixture-low-capacity
    name: Fixture Low Capacity
    provider: fixture
    region: local-lab
    architecture: amd64
    roles:
      - runtime
    labels:
      - fixture
      - constrained
    capabilities:
      docker: false
      docker_compose: false
      caddy: true
      edge: true
      network: true
      backups: false
      postgres: false
      redis: false
      static_assets: true
      service_runtime: false
    capacity:
      memory: 512mb
      disk_free: 512mb

