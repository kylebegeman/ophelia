version: 1
profiles:
  - id: fixture-suite-review
    title: Fixture Suite Review
    summary: Full synthetic suite with the intentionally incomplete app expected to block child readiness.
    runtime_root: runtime
    manifests_dir: manifests
    ophelia_root: ../..
    host_config: host-inventory.yml
    provider_config: integrations.yml
    plugins_dir: plugins
    include_hardening: true
    include_fixture_suite: true
    allow_blocked_live_readiness: true
    expected:
      live_status: blocked
      hardening_status: warning
      go_no_go: review
      app_count: 8
      drift_count: 8
      blocked_apps:
        - fixture-incomplete-app
      warning_apps:
        - fixture-http-service
        - fixture-multi-service
        - fixture-postgres-api
        - fixture-redis-worker
        - fixture-stateful-volume
        - fixture-static-site
        - fixture-tunnel-app

  - id: fixture-postgres-focused
    title: Fixture Postgres Focused
    summary: Focuses one stateful Postgres-backed app while shared fixture host/provider checks still run.
    runtime_root: runtime
    manifests_dir: manifests
    ophelia_root: ../..
    host_config: host-inventory.yml
    provider_config: integrations.yml
    app: fixture-postgres-api
    environment: staging
    expected:
      live_status: blocked
      app_count: 1
      drift_count: 1
      blocked_apps: []
      warning_apps:
        - fixture-postgres-api
      app_statuses:
        fixture-postgres-api: warning

  - id: fixture-static-focused
    title: Fixture Static Focused
    summary: Focuses the image-less static app so live drills cover non-Docker deployment shapes.
    runtime_root: runtime
    manifests_dir: manifests
    ophelia_root: ../..
    host_config: host-inventory.yml
    provider_config: integrations.yml
    app: fixture-static-site
    environment: staging
    expected:
      live_status: blocked
      app_count: 1
      drift_count: 1
      blocked_apps: []
      warning_apps:
        - fixture-static-site
      app_statuses:
        fixture-static-site: warning

  - id: fixture-incomplete-focused
    title: Fixture Incomplete Focused
    summary: Focuses the intentionally blocked app to prove expected-failure workflows stay deterministic.
    runtime_root: runtime
    manifests_dir: manifests
    ophelia_root: ../..
    host_config: host-inventory.yml
    provider_config: integrations.yml
    app: fixture-incomplete-app
    environment: staging
    expected:
      live_status: blocked
      app_count: 1
      drift_count: 1
      blocked_apps:
        - fixture-incomplete-app
      warning_apps: []
      app_statuses:
        fixture-incomplete-app: blocked
