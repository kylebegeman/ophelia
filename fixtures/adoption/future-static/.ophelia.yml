version: 1
app: future-static
environment: staging
kind: static
static_root: public

routes:
  - domain: future-static.fixture.invalid

pack:
  portability: standard
  owner: platform-fixtures
  description: Synthetic future static-site app repo for adoption planning.

host_requirements:
  requires_edge: true
  requires_docker: false
  min_memory: 512m
  min_disk_free: 1gb

data:
  static_assets:
    - name: public
      source: public
  backups:
    required: false
    restore_drill_required: false
    offsite_required: false

observability:
  health:
    url: https://future-static.fixture.invalid/
    expect_status: 200
  logs:
    containers: false
    retain_days: 7
