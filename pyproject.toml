[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophelia"
version = "0.2.4"
description = "Deployment control plane for the Ophelia VPS platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["deployment", "vps", "operations", "infrastructure", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
ship = "ophelia.main:main"
ophelia = "ophelia.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophelia.resources" = ["templates/**/*.tpl"]
