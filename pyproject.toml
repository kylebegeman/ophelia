[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophelia"
version = "0.2.4"
description = "Deployment control plane for the Ophelia VPS platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["jsonschema>=4"]

[project.scripts]
ship = "ophelia.main:main"
ophelia = "ophelia.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophelia.resources" = ["templates/**/*.tpl"]
