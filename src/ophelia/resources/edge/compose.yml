name: ophelia-shared

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${OPHELIA_HTTP_PORT:-80}:80"
      - "${OPHELIA_HTTPS_PORT:-443}:443"
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
      - --envfile
      - /etc/caddy/env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${OPHELIA_RUNTIME_ROOT}/caddy/env:/etc/caddy/env:ro
      - ${OPHELIA_RUNTIME_ROOT}/caddy/global.d:/etc/caddy/global.d:ro
      - ${OPHELIA_RUNTIME_ROOT}/caddy/sites.d:/etc/caddy/sites.d:ro
      - ${OPHELIA_RUNTIME_ROOT}:${OPHELIA_RUNTIME_ROOT}:ro
      - ${OPHELIA_STATIC_ROOT}:${OPHELIA_STATIC_ROOT}:ro
      - ophelia-caddy-data:/data
      - ophelia-caddy-config:/config
    networks: [ophelia-edge]

volumes:
  ophelia-caddy-data:
    name: ophelia-caddy-data
  ophelia-caddy-config:
    name: ophelia-caddy-config

networks:
  ophelia-edge:
    name: ophelia-edge
    external: true
